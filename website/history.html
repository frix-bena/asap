<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvestVault — Transaction History</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">InvestVault</div>
    <div class="sidebar-tagline">Simulated Platform</div>
    <nav class="nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="invest.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Invest
      </a>
      <a href="wallet.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 3H8L4 7h16l-4-4z"/><circle cx="17" cy="14" r="1" fill="currentColor"/></svg>
        Wallet
      </a>
      <a href="history.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10l4 4"/><circle cx="12" cy="12" r="10"/></svg>
        Transactions
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebar-avatar">U</div>
        <div>
          <div class="sidebar-user-name" id="sidebar-name">—</div>
          <div class="sidebar-user-email" id="sidebar-email">—</div>
        </div>
      </div>
      <button class="btn-logout" id="btn-logout">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Transaction History</h1>
        <p class="page-sub">All deposits, withdrawals, and ROI payouts</p>
      </div>
      <!-- Filter -->
      <div class="page-actions">
        <select id="type-filter" class="input" style="width:auto;padding:.55rem 1rem;font-size:.85rem">
          <option value="">All Types</option>
          <option value="DEPOSIT">Deposits</option>
          <option value="WITHDRAWAL">Withdrawals</option>
          <option value="ROI_PAYOUT">ROI Payouts</option>
        </select>
      </div>
    </div>

    <div class="glass table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th class="right">Amount</th>
              <th class="center">Status</th>
              <th class="right">Reference</th>
              <th class="right">Date</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--text-2)">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <!-- Pagination -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)">
        <span id="pagination-info" style="font-size:.8rem;color:var(--text-2)">—</span>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-secondary btn-sm" id="btn-prev" disabled>← Prev</button>
          <button class="btn btn-secondary btn-sm" id="btn-next" disabled>Next →</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  if (!Auth.requireAuth()) throw new Error('redirect');

  const TX_CFG = {
    DEPOSIT:    { label: 'Deposit',    badge: 'badge-green',  color: 'var(--emerald)',     sign: '+' },
    WITHDRAWAL: { label: 'Withdrawal', badge: 'badge-red',    color: '#f87171',            sign: '-' },
    ROI_PAYOUT: { label: 'ROI Payout', badge: 'badge-violet', color: 'var(--violet-lt)',   sign: '+' },
  };

  let page  = 1;
  const limit = 20;
  let totalPages = 1;
  let filterType = '';

  async function loadHistory() {
    const tbody = document.getElementById('history-tbody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;color:var(--text-2)">Loading…</td></tr>';

    const params = new URLSearchParams({ page, limit });
    if (filterType) params.set('type', filterType);
    const data = await api.get(`/api/history?${params}`);

    totalPages = data.pagination.pages || 1;
    const total = data.pagination.total || 0;
    const from  = (page - 1) * limit + 1;
    const to    = Math.min(page * limit, total);

    document.getElementById('pagination-info').textContent =
      total === 0 ? 'No transactions' : `Showing ${from}–${to} of ${total}`;
    document.getElementById('btn-prev').disabled = page <= 1;
    document.getElementById('btn-next').disabled = page >= totalPages;

    if (!data.data?.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--text-2)">No transactions found.</td></tr>';
      return;
    }

    tbody.innerHTML = data.data.map(tx => {
      const cfg = TX_CFG[tx.type] || TX_CFG.DEPOSIT;
      const ref = tx.reference ? tx.reference.slice(0, 8) + '…' : '—';
      return `
        <tr>
          <td><span class="badge ${cfg.badge}">${cfg.label}</span></td>
          <td class="right" style="color:${cfg.color};font-weight:600">${cfg.sign}KES ${fmt(tx.amount)}</td>
          <td class="center">
            <span class="badge ${tx.status === 'COMPLETED' ? 'badge-green' : 'badge-amber'}">
              ${tx.status}
            </span>
          </td>
          <td class="right" style="font-size:.78rem;color:var(--text-2);font-family:monospace">${ref}</td>
          <td class="right" style="font-size:.8rem;color:var(--text-2)">${new Date(tx.createdAt).toLocaleString()}</td>
        </tr>`;
    }).join('');
  }

  document.getElementById('type-filter').addEventListener('change', e => {
    filterType = e.target.value; page = 1; loadHistory();
  });
  document.getElementById('btn-prev').addEventListener('click', () => { if (page > 1) { page--; loadHistory(); } });
  document.getElementById('btn-next').addEventListener('click', () => { if (page < totalPages) { page++; loadHistory(); } });

  loadHistory();
</script>
</body>
</html>
