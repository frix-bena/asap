<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvestVault — Create Account</title>
  <meta name="description" content="Create a free InvestVault simulated investment account." />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="auth-bg">
    <div class="glass auth-card">
      <div style="text-align:center;margin-bottom:2rem">
        <div class="auth-logo">InvestVault</div>
        <p class="auth-sub">Create your free account</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input id="fullName" type="text" class="input" placeholder="John Doe" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="phone number">Phone Number</label>
          <input id="phone number" type="number" class="input" placeholder="254700000000" autocomplete="phone number" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password <span
              style="color:var(--text-3);font-size:.75rem;text-transform:none">(min 8 characters)</span></label>
          <input id="password" type="password" class="input" placeholder="••••••••" minlength="8"
            autocomplete="new-password" />
        </div>
        <button id="submit-btn" type="submit" class="btn btn-primary btn-full" style="margin-top:.5rem">
          Create Account
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    Auth.requireGuest();

    const form = document.getElementById('register-form');
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      setLoading(submitBtn, true);

      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone number').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await api.post('/api/auth/register', { fullName, phone, password });
        Auth.setSession(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        const msgs = err.data?.errors?.map(e => e.msg).join(', ');
        showAlert(alertEl, msgs || err.message || 'Registration failed.');
        setLoading(submitBtn, false, 'Create Account');
      }
    });
  </script>
</body>

</html>
