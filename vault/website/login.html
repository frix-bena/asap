<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Vault — Login</title>
  <meta name="description" content="Sign in to your Vault investment account."/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="glass" style="padding:2.25rem">
      <div style="text-align:center;margin-bottom:1.75rem">
        <div class="logo">Vault</div>
        <p class="auth-sub" style="margin-bottom:0">Sign in to your account</p>
      </div>
      <div id="alert" class="alert"></div>
      <form id="form">
        <div class="form-group">
          <label class="label">M-Pesa Phone Number</label>
          <input id="phone" type="tel" class="input" placeholder="0712 345 678" required autocomplete="tel"/>
          <div class="input-hint">Use your Safaricom M-Pesa number</div>
        </div>
        <div class="form-group">
          <label class="label">Password</label>
          <input id="password" type="password" class="input" placeholder="••••••" required autocomplete="current-password"/>
        </div>
        <button id="submit" type="submit" class="btn btn-green btn-full" style="margin-top:.5rem">Sign In</button>
      </form>
      <p class="auth-footer">No account? <a href="register.html">Create one</a></p>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
<script>
  Auth.requireGuest();
  const alertEl = document.getElementById('alert');
  const submit  = document.getElementById('submit');

  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault(); hideAlert(alertEl); setLoading(submit, true);
    try {
      const d = await api.post('/auth/login', {
        phone:    document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
      });
      Auth.setSession(d.token, d.user);
      location.href = 'dashboard.html';
    } catch(err) {
      showAlert(alertEl, err.message || 'Login failed.');
      setLoading(submit, false, 'Sign In');
    }
  });
</script>
</body>
</html>
