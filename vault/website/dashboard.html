<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Vault — Dashboard</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">Vault</div>
    <div class="sidebar-tag">Investment Platform</div>
    <nav class="nav">
      <a href="dashboard.html" class="nav-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="invest.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Invest
      </a>
      <a href="wallet.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><circle cx="17" cy="14" r="1" fill="currentColor"/></svg>
        Wallet
      </a>
      <a href="referrals.html" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Referrals
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="avatar" id="sb-avatar">V</div>
        <div><div class="user-name" id="sb-name">—</div><div class="user-phone" id="sb-phone">—</div></div>
      </div>
      <button class="btn-logout" id="btn-logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="page-hdr">
      <div><h1 class="page-title">Dashboard</h1><p class="page-sub">Your investment overview</p></div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-glow kpi-glow-g"></div><div class="kpi-label">Withdrawable Balance</div><div class="kpi-val" id="kpi-balance">—</div></div>
      <div class="kpi"><div class="kpi-glow kpi-glow-a"></div><div class="kpi-label">Total Earned</div><div class="kpi-val" id="kpi-earned">—</div></div>
      <div class="kpi"><div class="kpi-glow kpi-glow-v"></div><div class="kpi-label">Total Withdrawn</div><div class="kpi-val" id="kpi-withdrawn">—</div></div>
    </div>

    <!-- Active Investment / Countdown -->
    <div class="inv-card glass" id="inv-section">
      <div class="inv-none">Loading…</div>
    </div>

    <!-- Recent Transactions -->
    <div class="card glass">
      <div class="card-title">Recent Transactions</div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Type</th><th class="r">Amount</th><th class="r">Status</th><th class="r">Date</th></tr></thead>
          <tbody id="tx-tbody"><tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text-2)">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  if (!Auth.requireAuth()) throw 0;

  const TX_CFG = {
    DEPOSIT:       { label:'Deposit',       badge:'badge-green',  sign:'+' },
    CLAIM:         { label:'Claim',         badge:'badge-green',  sign:'+' },
    SIGNUP_BONUS:  { label:'Signup Bonus',  badge:'badge-violet', sign:'+' },
    REFERRAL_BONUS:{ label:'Referral',      badge:'badge-violet', sign:'+' },
    WITHDRAWAL:    { label:'Withdrawal',    badge:'badge-amber',  sign:'-' },
  };

  let invData = null;

  function renderClaimReady() {
    document.getElementById('inv-section').innerHTML = `
      <div class="inv-header">
        <div><div class="inv-tier-name">${invData.tier.name}</div><div class="inv-daily">Daily: ${fmt(invData.tier.dailyClaim)}</div></div>
        <span class="badge badge-green">Active</span>
      </div>
      <div class="claim-ready">
        <div class="claim-ready-text">🎉 Your daily earnings are ready to claim!</div>
        <button class="btn btn-green" id="claim-btn">Claim ${fmt(invData.tier.dailyClaim)}</button>
        <div id="claim-alert" class="alert" style="margin-top:.75rem"></div>
      </div>`;

    document.getElementById('claim-btn').addEventListener('click', async () => {
      const btn = document.getElementById('claim-btn');
      const al  = document.getElementById('claim-alert');
      setLoading(btn, true);
      try {
        const r = await api.post('/invest/claim', {});
        showAlert(al, `✅ ${r.message}`, 'success');
        setTimeout(() => loadDashboard(), 2000);
      } catch(err) {
        showAlert(al, err.message, 'error');
        setLoading(btn, false, `Claim ${fmt(invData.tier.dailyClaim)}`);
      }
    });
  }

  function renderCountdown() {
    document.getElementById('inv-section').innerHTML = `
      <div class="inv-header">
        <div><div class="inv-tier-name">${invData.tier.name}</div><div class="inv-daily">Daily: ${fmt(invData.tier.dailyClaim)}</div></div>
        <span class="badge badge-green">Active</span>
      </div>
      <div class="countdown">
        <div class="countdown-ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle class="ring-bg" r="52" cx="60" cy="60"/>
            <circle class="ring-fg" id="ring-fg" r="52" cx="60" cy="60"/>
          </svg>
          <div class="countdown-time">
            <div class="countdown-hms" id="countdown-hms">00:00:00</div>
            <div class="countdown-lbl" id="countdown-lbl">until next claim</div>
          </div>
        </div>
        <p style="font-size:.78rem;color:var(--text-2)">Next claim: ${new Date(invData.nextClaimAt).toLocaleString()}</p>
      </div>`;

    startCountdown({
      nextClaimAt: invData.nextClaimAt,
      onReady: renderClaimReady,
    });
  }

  async function loadDashboard() {
    const [wallet, inv, txs] = await Promise.all([
      api.get('/wallet'),
      api.get('/invest/my'),
      api.get('/wallet/transactions?limit=8'),
    ]);

    document.getElementById('kpi-balance').textContent   = fmt(wallet.withdrawable);
    document.getElementById('kpi-earned').textContent    = fmt(wallet.totalEarned);
    document.getElementById('kpi-withdrawn').textContent = fmt(wallet.totalWithdrawn);

    // Investment section
    const sec = document.getElementById('inv-section');
    if (!inv) {
      sec.innerHTML = `<div class="inv-none">No active investment. <a href="invest.html" style="color:var(--green)">Invest now →</a></div>`;
    } else {
      invData = inv;
      if (inv.canClaim) renderClaimReady();
      else renderCountdown();
    }

    // Transactions
    const tbody = document.getElementById('tx-tbody');
    if (!txs.data?.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:2rem;color:var(--text-2)">No transactions yet.</td></tr>';
    } else {
      tbody.innerHTML = txs.data.map(tx => {
        const c = TX_CFG[tx.type] || { label: tx.type, badge: 'badge-green', sign: '+' };
        return `<tr>
          <td><span class="badge ${c.badge}">${c.label}</span></td>
          <td class="r" style="font-weight:600;color:${c.sign==='+' ? 'var(--green)' : 'var(--amber)'}">${c.sign}KES ${fmtNum(tx.netAmount)}</td>
          <td class="r"><span class="badge ${tx.status==='COMPLETED'?'badge-green':tx.status==='FAILED'?'badge-red':'badge-amber'}">${tx.status}</span></td>
          <td class="r" style="font-size:.75rem;color:var(--text-2)">${new Date(tx.createdAt).toLocaleString()}</td>
        </tr>`;
      }).join('');
    }
  }

  loadDashboard();
</script>
</body>
</html>
